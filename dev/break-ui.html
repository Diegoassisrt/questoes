<!DOCTYPE html><html lang="pt-BR" data-paleta="roxobranco"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>break-ui · teste de dados extremos (somente desenvolvimento)</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/temas.css"><link rel="stylesheet" href="../css/design.css">
<style>
body{padding:16px 16px 90px;max-width:900px;margin:0 auto}
h4.dev{margin:26px 0 8px;font:700 .72rem system-ui;letter-spacing:.08em;text-transform:uppercase;color:#7a7396}
.dev-toggle{max-width:94vw;overflow-x:auto;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:999;display:flex;gap:2px;padding:3px;border-radius:10px;background:#d9d6e3;font:600 12px system-ui;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.dev-toggle button{all:unset;padding:7px 10px;border-radius:8px;cursor:pointer;color:#333;white-space:nowrap}
.dev-toggle button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.qtop-demo{position:relative;border-radius:18px;overflow:hidden}
</style></head><body>
<div id="out"></div>
<div class="dev-toggle" id="tg"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sem=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const fmtDataC=iso=>iso.split("-").reverse().join("/"), SVG_LIXO="🗑", SVG_SINO="🔔", SVG_VAZIO_REV="", aviso=()=>{}, marcarAtividade=()=>{}, salvarRevisao=()=>{};
let revisaoEstado={estudos:[]}, secao="revisao", renderInicio=()=>{};
const atualizarBadgeRevisao=()=>{};
const REV_INT=[1,7,15,30,60]; // dias depois do estudo em que cada revisão é agendada
const pad2=n=>String(n).padStart(2,"0");
const isoDe=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const isoHoje=()=>isoDe(new Date());
const somaDias=(iso,n)=>{const [y,m,d]=iso.split("-").map(Number);return isoDe(new Date(y,m-1,d+n))};
const difDias=(a,b)=>{const f=t=>{const [y,m,d]=t.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((f(a)-f(b))/864e5)};
const fmtData=iso=>{const [,m,d]=iso.split("-");return `${d}/${m}`};
const REV_MENSAL=30; // depois das 5 primeiras revisões, o tema volta todo mês (nunca "acaba")
const estudos=()=>{const a=revisaoEstado.estudos||(revisaoEstado.estudos=[]); a.forEach(e=>{if(!e.prox)e.prox=somaDias(e.feitaEm||isoHoje(),REV_MENSAL)}); return a}; // ciclos antigos "concluídos" voltam para a fila mensal
const revAtivos=()=>estudos();
const revVencidas=()=>revAtivos().filter(e=>e.prox<=isoHoje());
function _x(){
  const n=revVencidas().length, b=document.querySelector('.mi[data-sec="revisao"]');
  if(b){let d=b.querySelector(".dot"); if(n){if(!d){d=document.createElement("span");d.className="dot";b.appendChild(d)} d.textContent=n}else if(d)d.remove()}
  document.title=(n?`(${n}) `:"")+"Área fiscal";
}
function revBanner(){
  const n=revVencidas().length; if(!n)return "";
  return `<div class="revalert"><span>${SVG_SINO}<span>Você tem <b>${n} revis${n>1?"ões":"ão"}</b> para fazer hoje.</span></span><button class="pri small" data-secnav="revisao">Ver revisões</button></div>`;
}
function revConcluir(id){
  const e=estudos().find(x=>x.id===id); if(!e)return;
  e.antes={feitas:e.feitas,prox:e.prox,feitaEm:e.feitaEm||""}; // permite desfazer
  e.feitas++; e.feitaEm=isoHoje();
  e.prox=e.feitas<REV_INT.length?somaDias(e.data,REV_INT[e.feitas]):somaDias(isoHoje(),REV_MENSAL);
  const amanha=somaDias(isoHoje(),1); if(e.prox<amanha)e.prox=amanha; aviso("Revisão feita! Ela volta em "+fmtData(e.prox)+".");
  salvarRevisao(); marcarAtividade(); atualizarBadgeRevisao();
  if(secao==="revisao")renderRevisao(); else if(secao==="inicio")renderInicio();
}
function revDesfazer(id){
  const e=estudos().find(x=>x.id===id); if(!e)return;
  if(e.antes){e.feitas=e.antes.feitas;e.prox=e.antes.prox;e.feitaEm=e.antes.feitaEm;delete e.antes}
  else if(e.feitas>0){e.feitas--;e.prox=somaDias(e.data,REV_INT[e.feitas]||1);delete e.feitaEm}
  salvarRevisao(); atualizarBadgeRevisao();
  if(secao==="revisao")renderRevisao(); else if(secao==="inicio")renderInicio();
}
// Uma revisão fica marcada enquanto está em dia; só desmarca quando ela volta a vencer.
const revFeito=e=>e.feitas>0&&e.prox>isoHoje();
const revHoje=()=>estudos().filter(e=>e.prox<=isoHoje()||e.feitaEm===isoHoje())
  .sort((a,b)=>Number(revFeito(a))-Number(revFeito(b))||String(a.prox).localeCompare(String(b.prox)));
function revLinhaHTML(e,semMat){
  const hoje=isoHoje(), ok=revFeito(e), fim=false;
  let cl,tx;
  if(fim){cl="okrev";tx="Ciclo concluído"}
  else if(ok){cl="okrev";tx=`Feita · volta ${e.prox===somaDias(hoje,1)?"amanhã":"em "+fmtData(e.prox)}`}
  else{const d=difDias(e.prox,hoje); [cl,tx]=d<0?["late",`Atrasada ${-d} dia${d<-1?"s":""}`]:d===0?["due","Revisar hoje"]:["fut",d===1?"Amanhã":`Em ${d} dias (${fmtData(e.prox)})`]}
  const sub=[semMat?"":e.materia,e.erroId?"Do caderno de erros":`${e.apostila?"Concluída":"Estudada"} em ${fmtDataC(e.data)}`,(n=>n<=REV_INT.length?`Revisão ${n} de ${REV_INT.length}`:`Revisão ${n} · mensal`)(e.feitas+(ok?0:1))].filter(Boolean).join(" · ");
  return `<label class="rvlinha ${cl}" data-rvid="${esc(e.id)}"><input type="checkbox" class="rvcheck" data-rvcheck="${esc(e.id)}" ${ok?"checked":""} ${fim?"disabled":""} aria-label="${ok?"Revisão feita. Desmarcar para desfazer":"Marcar esta revisão como feita"}"><span class="rvinfo"><b>${esc(e.tema)}</b><small>${esc(sub)}</small></span><span class="rvst">${tx}</span><button type="button" class="ico rvdel" data-revdel="${esc(e.id)}" title="Excluir esta revisão" aria-label="Excluir esta revisão">${SVG_LIXO}</button></label>`;
}
let revSoAtr=localStorage.getItem("rev_so_atr")==="1", revPorMat=localStorage.getItem("rev_por_mat")!=="0";
function renderRevisao(){
  const el=$("secRevisao"), vencidas=revVencidas().length, hoje=isoHoje();
  const atrasada=e=>!revFeito(e)&&e.prox<=hoje;
  const ord=(a,b)=>Number(revFeito(a))-Number(revFeito(b))||a.prox.localeCompare(b.prox)||String(a.tema).localeCompare(String(b.tema),"pt-BR",{numeric:true});
  const todos=revAtivos().slice().sort(ord), ativos=revSoAtr?todos.filter(atrasada):todos;
  let lista;
  if(!todos.length) lista=`<div class="revempty">${SVG_VAZIO_REV}<b>Nenhuma revisão agendada.</b><p>Quando você marcar uma apostila como “Terminei” em Conteúdo, o lembrete aparece aqui.</p><button class="pri" data-secnav="conteudo">Ir para Conteúdo</button></div>`;
  else if(!ativos.length) lista=`<div class="revempty">${SVG_VAZIO_REV}<b>Nenhuma revisão atrasada.</b><p>Tudo em dia! Desmarque “Somente atrasadas” para ver todas.</p></div>`;
  else if(revPorMat){
    const gr=new Map();
    ativos.forEach(e=>{const k=sem(e.materia||"")||"~"; if(!gr.has(k))gr.set(k,{nome:(e.materia||"").trim()||"Sem matéria",itens:[]}); gr.get(k).itens.push(e)});
    const arr=[...gr.values()].map(g=>({...g,atr:g.itens.filter(atrasada).length})).sort((a,b)=>b.atr-a.atr||a.nome.localeCompare(b.nome,"pt-BR"));
    lista=arr.map(g=>`<section class="rvgrupo"><div class="rvgh"><b>${esc(g.nome)}</b><span>${g.itens.length} ${g.itens.length>1?"temas":"tema"}${g.atr?` · <em>${g.atr} atrasada${g.atr>1?"s":""}</em>`:""}</span></div><div class="rvlista">${g.itens.map(x=>revLinhaHTML(x,true)).join("")}</div></section>`).join("");
  } else lista=`<div class="rvlista">${ativos.map(x=>revLinhaHTML(x)).join("")}</div>`;
  el.innerHTML=`<div class="ctop"><div><h2>Revisão</h2></div></div>
  <div id="lembreteSlot"></div>
  ${vencidas?`<div class="revalert"><span>${SVG_SINO}<span><b>${vencidas} revis${vencidas>1?"ões":"ão"}</b> para fazer hoje (ou atrasada${vencidas>1?"s":""}).</span></span></div>`:""}
  ${todos.length?`<div class="rvtools"><label class="rvsw"><input type="checkbox" id="rvSoAtr" ${revSoAtr?"checked":""}><span>Somente atrasadas e de hoje</span></label><label class="rvsw"><input type="checkbox" id="rvPorMat" ${revPorMat?"checked":""}><span>Separar por matéria</span></label></div>`:""}
  ${lista}`;
  atualizarBadgeRevisao();
  document.dispatchEvent(new CustomEvent("af:render",{detail:{secao:"revisao",el}}));
}
document.addEventListener("change",e=>{
  const t=e.target; if(!t||(t.id!=="rvSoAtr"&&t.id!=="rvPorMat"))return;
  if(t.id==="rvSoAtr"){revSoAtr=t.checked;try{localStorage.setItem("rev_so_atr",revSoAtr?"1":"0")}catch(x){}}
  else{revPorMat=t.checked;try{localStorage.setItem("rev_por_mat",revPorMat?"1":"0")}catch(x){}}
  renderRevisao();
});

const matHue=i=>((i<0?0:i)*53+262)%360;
const h=isoHoje();
const DEMO={mats:["Auditoria","Contabilidade","Direito tributário","Português"],user:"Diego",lista:"07 – DRE (prof gilmar)",c:{acerto:7,erro:1,branco:50,pend:6},
  rev:[["Auditoria","1 - Conceitos iniciais de auditoria e NBC TA 200",1,-8,-1],["Contabilidade","05 - Escrituração",1,-8,-1],["Direito tributário","Obrigação tributária",2,-20,3]]};
const WORST={mats:["Auditoria","Contabilidade","Direito Administrativo e Constitucional (Módulo Avançado)","Legislação Tributária Estadual e Municipal Aplicada ao ICMS e ao ISS","Português","R","😀 Raciocínio Lógico","Matemática Financeira e Estatística Aplicada à Auditoria Fiscal"],
  user:"Aleksandra Wiśniewska-Kowalczyk",lista:"07 – DRE (prof gilmar) — Resolução comentada das questões CESPE/CEBRASPE de 2014 a 2023 para Perito Criminal Federal",c:{acerto:1284,erro:12480,branco:100000,pend:1},
  rev:[["Direito Administrativo e Constitucional (Módulo Avançado)","1 - Conceitos iniciais de auditoria, NBC TA 200 e objetivos gerais do auditor independente na condução da auditoria de acordo com as normas",1,-8,-1],
       ["R","Averbação_do_imóvel_no_registro_geral_de_imóveis_conforme_a_Lei_6.015-1973_art.167_inciso_I_item_1",1,-8,-1],
       ["😀 Raciocínio Lógico","Ω",1,-8,-1],["Legislação Tributária Estadual e Municipal Aplicada ao ICMS e ao ISS","05 - Escrituração",6,-100,40],
       ["","Tema sem matéria",1,-3,-1],["Auditoria","日本語のテーマ名と العربية",2,-20,3]]};
const ONE={...DEMO,mats:["Auditoria"],rev:[DEMO.rev[0]]}, EMPTY={...DEMO,rev:[],mats:[]};
function fixture(k){
  if(k==="rows"){const o={...WORST,rev:[]};for(let i=0;i<1000;i++)o.rev.push([WORST.mats[i%8],"Tema número "+(i+1)+" — "+WORST.rev[i%6][1],i%7,-(i%30),(i%9)-4]);return o}
  return {demo:DEMO,worst:WORST,empty:EMPTY,one:ONE}[k]||DEMO}
const num=n=>new Intl.NumberFormat("pt-BR").format(n);
function render(k){
  const F=fixture(k); revisaoEstado.estudos=F.rev.map((r,i)=>({id:"e"+i,materia:r[0],tema:r[1],data:somaDias(h,r[2]*-0+r[3]),feitas:r[2],prox:somaDias(h,r[4])}));
  const m=(k==="worst"?F.mats[3]:F.mats[1])||F.mats[0]||"—", c=F.c, total=c.acerto+c.erro+c.branco+c.pend, resp=total-c.branco, corr=c.acerto+c.erro, pct=corr?c.acerto/corr*100:0;
  const menu=F.mats.map((x,i)=>`<button type="button" class="msd-it ${x===m?"on":""}"><span class="msd-av" style="--h:${matHue(i)}">${esc(x.trim().charAt(0).toUpperCase())}</span><span class="msd-nm">${esc(x)}</span><span class="msd-n">${i+1} ${i===0?"lista":"listas"}</span><svg class="msd-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>`).join("");
  const kp=(cl,n,t)=>`<div class="rp-k"><b>${num(n)}</b><span><i class="dot ${cl}"></i>${t}</span></div>`;
  $("out").innerHTML=`
  <h4 class="dev">Seletor de matérias (menu aberto)</h4>
  <div class="phead pbar"><div class="matsel"><div class="msd"><button type="button" class="msd-btn" aria-expanded="true"><span class="msd-av" style="--h:${matHue(1)}">${esc(m.trim().charAt(0).toUpperCase())}</span><span class="msd-txt"><small>Matéria</small><b>${esc(m)}</b></span><svg class="msd-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="msd-menu" style="position:static;margin-top:8px;max-height:230px">${menu||'<div class="muted" style="padding:14px">Nenhuma matéria ainda.</div>'}</div></div></div></div>
  <h4 class="dev">Topo das questões</h4>
  <div class="qtop-demo"><header class="qtop" style="position:relative"><div class="qrow"><button class="qbtn">✕</button><div class="qtit"><small>${esc(m)}</small><b>${esc(F.lista)}</b></div><span class="qcount">${num(resp)}/${num(total)}</span>
  <div class="qscore"><div class="qs ok"><b>${num(c.acerto)}</b><span>Acertos</span></div><div class="qs er"><b>${num(c.erro)}</b><span>Erros</span></div><div class="qs br"><b>${num(c.branco)}</b><span>Em branco</span></div><div class="qs pc"><b>${corr?Math.round(pct):0}%</b><span>Aproveit.</span></div></div><button class="qbtn">⛶</button></div>
  <div class="qprog"><div class="qbar"></div></div></header></div>
  <h4 class="dev">Relatório de desempenho</h4>
  <details class="card rp" open><summary><b>Relatório de desempenho</b></summary><div class="rp-top"><div class="rp-ring ${corr?"":"vazio"}" style="--p:${pct}"><div><b>${corr?Math.round(pct)+"%":"—"}</b><span>Aproveitamento</span></div></div>
  <div class="rp-kpis">${kp("s-acerto",c.acerto,"Acertos")}${kp("s-erro",c.erro,"Erros")}${kp("s-pendente",c.pend,"Aguardando correção")}${kp("s-branco",c.branco,"Em branco")}</div></div></details>
  <h4 class="dev">Revisão</h4><section id="secRevisao"></section>
  <h4 class="dev">Chip do usuário</h4><div style="display:flex;max-width:230px"><div class="chip-user" style="display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid #ddd;border-radius:999px;background:#fff"><span style="flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#ede7ff;color:#6d28d9;font-weight:800">${esc(F.user.charAt(0))}</span><b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(F.user)}</b></div></div>`;
  renderRevisao();
}
const ESTADOS=[["demo","Demo data"],["worst","Worst case"],["empty","Empty"],["one","One"],["rows","1.000 rows"]];
const k=new URLSearchParams(location.search).get("data")||"demo";
$("tg").innerHTML=ESTADOS.map(([v,t])=>`<button class="${v===k?"on":""}" onclick="location.search='?data=${v}'">${t}</button>`).join("");
render(k);
</script></body></html>
