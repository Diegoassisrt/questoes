<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Concursos">
<meta name="theme-color" content="#090d16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Estudos para Concursos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#090d16;--card:#0f172a;--txt:#f1f5f9;--mut:#94a3b8;--pri:#3b82f6;--ok:#10b981;--err:#f87171;
  --bd:rgba(148,163,184,.16);--line:rgba(255,255,255,.08);--glass:rgba(15,23,42,.62);--glass-s:rgba(15,23,42,.9);
  --sh-s:inset 0 1px 0 rgba(255,255,255,.06),0 14px 34px -16px rgba(0,0,0,.8);--sh-l:inset 0 1px 0 rgba(255,255,255,.08),0 26px 56px -20px rgba(0,0,0,.9)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--txt);
  background:radial-gradient(900px 520px at 12% -10%,rgba(37,99,235,.22),transparent 60%),radial-gradient(700px 420px at 100% 0,rgba(16,185,129,.08),transparent 60%),#090d16;background-attachment:fixed}
h1,h2,h3,h4{color:#fff;letter-spacing:-.015em}
.muted,small{color:var(--mut)}
input,button,select,textarea{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt)}
input[type=text],#novaMateria{width:100%;margin-bottom:6px}
button{cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .25s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s}
button:active{transform:scale(.96)}
button.pri,.addbig{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:0;font-weight:600;box-shadow:0 12px 26px -10px rgba(37,99,235,.8)}
@media(hover:hover){button.pri:hover,.addbig:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(37,99,235,.9)}}
button.pri:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}

/* Layout Minimalista & Executivo */
#app{display:flex;max-width:none;margin:0;min-height:100vh;padding-top:env(safe-area-inset-top)}
#side{flex:0 0 264px;width:264px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;padding:20px 14px;
  background:linear-gradient(180deg,#0b1120,#070a12);border-right:1px solid var(--line);box-shadow:20px 0 50px -30px rgba(0,0,0,.9);
  transition:width .3s cubic-bezier(.2,.8,.2,1),flex-basis .3s cubic-bezier(.2,.8,.2,1)}
.sbrand{display:flex;align-items:center;gap:12px;padding:4px 6px;color:#fff;font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.sbrand small{display:block;font-weight:500;font-size:.66rem;color:var(--mut);letter-spacing:.02em}
.logo{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 0 24px rgba(59,130,246,.55)}
.perfil{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line)}
.pinfo{display:flex;gap:10px;align-items:center;min-width:0}
#avatar{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#3b82f6,#10b981);box-shadow:0 0 18px rgba(59,130,246,.45)}
.ptxt{min-width:0;display:flex;flex-direction:column}
#usuario{color:#fff;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#statusCiclo{font-size:.72rem;line-height:1.4;color:var(--mut)}
#sair,#colapsar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mut);font-size:.82rem}
#sair:hover,#colapsar:hover{color:#fff;background:rgba(255,255,255,.08)}
#side svg,.mi svg{width:20px;height:20px;flex:0 0 20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#side #menu{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:0}
#side #menu .mi{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:transparent;border:1px solid transparent;color:var(--mut);font-weight:600;text-align:left}
#side #menu .mi:hover{background:rgba(255,255,255,.05);color:#fff}
#side #menu .mi.on{color:#fff;background:linear-gradient(90deg,rgba(59,130,246,.22),rgba(59,130,246,.06));border-color:rgba(59,130,246,.38);box-shadow:0 0 30px -8px rgba(59,130,246,.6)}
#side #menu .mi.on::after{content:"";position:absolute;left:-14px;top:22%;height:56%;width:4px;border-radius:0 4px 4px 0;background:#3b82f6;box-shadow:0 0 14px #3b82f6}
.conteudo{flex:1;min-width:0;padding:30px 34px 40px}
.conteudo>section{max-width:1180px;margin:0 auto}

/* Lista de Matérias na Sidebar */
.matbox{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.mathead{display:flex;align-items:center;justify-content:space-between;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:0 4px}
.mathead button{width:28px;height:28px;padding:0;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:0;font-size:1.1rem;line-height:1}
#buscaMat,#buscaMat2{width:100%;padding:9px 12px;border-radius:12px;font-size:.85rem}
.matlist{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:3px;padding-right:2px}
.mitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--mut);text-align:left}
.mitem:hover{background:rgba(255,255,255,.05);color:#fff}
.mitem.on{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.38);color:#fff}
.mdot2{flex:0 0 8px;height:8px;border-radius:50%;background:hsl(var(--h) 80% 62%);box-shadow:0 0 8px hsl(var(--h) 80% 55%)}
.mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
.mc{font-size:.7rem;background:rgba(255,255,255,.08);border-radius:999px;padding:1px 8px}
.mobonly{display:none}
@media(max-width:720px){
  #app{flex-direction:column}
  #side{display:contents}
  .sbrand{order:0;padding:12px 16px 4px}
  .perfil{order:1;flex-direction:row;align-items:center;justify-content:space-between;margin:6px 12px 0;padding:10px 12px}
  #colapsar{display:none}
  #app .conteudo{order:2;padding:14px 12px calc(110px + env(safe-area-inset-bottom))}
  #side #menu{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;flex-direction:row;gap:4px;padding:6px;
    border-radius:22px;background:rgba(15,23,42,.8);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 20px 44px -10px rgba(0,0,0,.85)}
  #side #menu .mi{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:9px 4px;font-size:.66rem;text-align:center;border-radius:16px}
  #side #menu .mi.on::after{display:none}
  .matbox{display:none}.mobonly{display:inline-block}
}

/* Superfícies de Vidro (Glassmorphism) */
.card,.secblock,.kdia,.kbar,.mcard,.drow,.pdfrow,.card.q,.iabox{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,0) 45%),var(--glass);border:1px solid var(--line);box-shadow:var(--sh-s);backdrop-filter:blur(14px)}
.card,.secblock,.kdia,.kbar,.mcard,.drow,.card.q,.iabox{border-radius:16px;padding:18px;margin-bottom:16px}
.card.q{color:#e2e8f0;box-shadow:var(--sh-l);padding:24px 22px 20px}
.enun{color:#e2e8f0;font-size:1.05rem;line-height:1.85}

/* Módulo "Continuar de Onde Parei" */
.resume-box{background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(16,185,129,.10));border:1px solid rgba(59,130,246,.35);border-radius:18px;padding:20px;margin-bottom:20px;box-shadow:var(--sh-s);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.resume-info h3{margin:0 0 4px;font-size:1.15rem}
.resume-info p{margin:0;color:var(--mut);font-size:.9rem}

/* Questões e Alternativas */
.qnum{display:inline-flex;align-items:center;gap:8px;font-size:1.08rem}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.badge{font-size:.64rem;font-weight:700;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);text-transform:uppercase}
.badge.banca{background:rgba(59,130,246,.16);color:#93c5fd}
.badge.ano{background:rgba(245,158,11,.14);color:#fcd34d}
.badge.orgao{background:rgba(16,185,129,.14);color:#6ee7b7}
.badge.mat{background:rgba(139,92,246,.16);color:#c4b5fd}
.alts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.altrow{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;transition:all .2s}
.altrow .alt{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer}
.alt input{position:absolute;opacity:0}
.letra{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut)}
.atxt{flex:1;line-height:1.6}
.altrow.sel{border-color:#3b82f6;background:rgba(59,130,246,.13)}
.altrow.sel .letra{background:#3b82f6;color:#fff}
.altrow.certa{border-color:#10b981;background:rgba(16,185,129,.13)}
.altrow.certa .letra{background:#10b981;color:#fff}
.altrow.errada{border-color:#ef4444;background:rgba(239,68,68,.12)}
.altrow.errada .letra{background:#ef4444;color:#fff}
.fb{padding:10px 14px;border-radius:12px;margin-top:12px;font-weight:600}
.q.ok .fb{background:rgba(16,185,129,.14);color:#6ee7b7}.q.err .fb{background:rgba(239,68,68,.14);color:#fca5a5}
.q.ok{border-left:4px solid #10b981}.q.err{border-left:4px solid #ef4444}.q.pend{border-left:4px solid #f59e0b}

/* Cartão do Professor FGV */
.iabox{background:linear-gradient(180deg,rgba(37,99,235,.16),rgba(15,23,42,.72));border:1px solid rgba(96,165,250,.4);border-radius:20px;margin-top:16px}
.iahead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(96,165,250,.28)}
.iatitle{display:flex;align-items:center;gap:10px}
.iaav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#7c3aed);color:#fff}
.iabox .iabody{padding:12px 16px 18px}
.isec{background:rgba(255,255,255,.04);border-left:4px solid rgba(148,163,184,.4);padding:12px 16px;border-radius:12px;margin-top:10px}
.isec h4{color:#fff;margin:0 0 6px}
.isb{line-height:1.75;color:#dbe4f0;white-space:pre-wrap}
.isec.ok{border-left-color:#10b981}.isec.info{border-left-color:#3b82f6}.isec.law{border-left-color:#8b5cf6}.isec.warn{border-left-color:#f59e0b}

/* Diagnóstico & Conteúdo */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}
.mcard{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px}
.mtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mdot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,hsl(var(--h) 55% 34%),hsl(var(--h) 60% 22%));color:hsl(var(--h) 90% 90%)}
.mnome{flex:1;font-weight:700;border:0;background:transparent;padding:6px 2px}
.mfields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld label{display:block;font-size:.68rem;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.fld input{width:100%;padding:9px 11px;border-radius:10px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%}
.bar .s-acerto{background:#10b981}.bar .s-erro{background:#ef4444}.bar .s-pendente{background:#f59e0b}
.stats{display:flex;flex-wrap:wrap;gap:12px;text-align:center;margin-bottom:16px}
.stats div{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats b{display:block;font-size:1.5rem;background:linear-gradient(135deg,#60a5fa,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:14px}
.drow{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;border-top:3px solid var(--line)}
.drow.alto{border-top-color:#ef4444}.drow.med{border-top-color:#f59e0b}.drow.ok{border-top-color:#10b981}

/* Diálogos */
dialog{background:rgba(15,23,42,.95);color:var(--txt);border:1px solid var(--line);border-radius:24px;padding:24px;width:min(92vw,400px);backdrop-filter:blur(20px)}
dialog::backdrop{background:rgba(15,23,42,.6);backdrop-filter:blur(6px)}
dialog input,dialog select{width:100%;margin-bottom:12px;padding:11px 12px;border-radius:10px}
.dbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(30,41,59,.95);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;border:1px solid var(--line)}
</style>
</head>
<body>
<section id="login" class="card" style="max-width:400px;margin:60px auto;padding:30px">
  <h2 style="margin-top:0">🔐 Entrar</h2>
  <form id="formLogin">
    <input type="email" id="email" placeholder="E-mail" autocomplete="username" required>
    <input type="password" id="senha" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password" minlength="6" required>
    <label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.9rem"><input type="checkbox" id="lembrar" checked> Lembrar de mim</label>
    <button class="pri" style="width:100%">Entrar</button>
    <button type="button" id="btnCriar" style="width:100%;margin-top:6px">Criar conta</button>
    <p id="erroLogin" style="color:var(--err);font-size:.85rem;margin-top:8px"></p>
  </form>
</section>
<div id="app" hidden>
  <aside id="side">
    <div class="sbrand"><span class="logo">⚡</span><span class="bt">Estudos<small>Concursos · Alta performance</small></span></div>
    <div id="conta" class="perfil" hidden>
      <div class="pinfo"><span id="avatar">?</span><span class="ptxt"><b id="usuario"></b><small id="statusCiclo">Carregando…</small></span></div>
      <button id="sair" title="Sair"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="lb">Sair</span></button>
    </div>
    <nav id="menu">
      <button class="mi on" data-sec="questoes"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9"/></svg><span class="lb">Questões</span></button>
      <button class="mi" data-sec="diagnostico"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg><span class="lb">Diagnóstico</span></button>
      <button class="mi" data-sec="conteudo"><svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span class="lb">Conteúdo</span></button>
      <button class="mi" data-sec="cronograma"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="lb">Cronograma</span></button>
    </nav>
    <div class="matbox">
      <div class="mathead"><span>Matérias</span><button id="novaMat" data-novamat="1">＋</button></div>
      <input id="buscaMat" placeholder="Buscar matéria…" autocomplete="off">
      <div id="listaMaterias" class="matlist"></div>
    </div>
    <button id="colapsar" title="Recolher menu"><svg viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg><span class="lb">Recolher</span></button>
  </aside>
  <div class="conteudo">
    <section id="secQuestoes"><div id="painel"></div></section>
    <section id="secDiagnostico" hidden></section>
    <section id="secConteudo" hidden></section>
    <section id="secCronograma" hidden></section>
  </div>
</div>
<dialog id="dlgCfg"><form id="formCfg" method="dialog">
  <h3>⚙️ Configurar Gemini</h3>
  <input id="cKey" type="password" placeholder="Chave de API (Google Gemini)" autocomplete="off" required>
  <p class="muted" style="font-size:.8rem">Gere sua chave em aistudio.google.com/apikey. Fica salva apenas neste aparelho.</p>
  <div class="dbtns"><button type="button" onclick="$('dlgCfg').close()">Cancelar</button><button class="pri">Salvar</button></div>
</form></dialog>
<dialog id="dlgMateria"><form id="formDlg" method="dialog">
  <h3>➕ Nova Matéria</h3>
  <input id="dNome" placeholder="Nome da matéria" required>
  <select id="dSec"><option value="regular">📘 PDF Regular</option><option value="passe">⭐ Passe Estratégico</option></select>
  <div class="dbtns"><button type="button" onclick="$('dlgMateria').close()">Cancelar</button><button class="pri">Adicionar</button></div>
</form></dialog>
<input type="file" id="apFile" accept="application/pdf" hidden>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, updateDoc, deleteDoc, writeBatch, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA9k7aqcBb2dVMVMA6zp0PAN6rLvADReaI",
  authDomain: "questoes-b0c0b.firebaseapp.com",
  projectId: "questoes-b0c0b",
  storageBucket: "questoes-b0c0b.firebasestorage.app",
  messagingSenderId: "194950212696",
  appId: "1:194950212696:web:b4b59dbf93460088056e2d",
  measurementId: "G-8H53FTS93Y"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

const $ = (id) => document.getElementById(id);
const esc = (s) => (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let user = null, materias = [], listas = [], conteudo = null, cron = null, unsubs = [];
let sel = { materia: null, lista: null }, secao = "questoes", filtro = "todas", faixa = { de: 1, ate: 9999 };
const col = (n) => collection(fs, "users", user.uid, n);
const ref = (n, id) => doc(fs, "users", user.uid, n, id);
const cfgRef = (n) => doc(fs, "users", user.uid, "config", n);
const falha = (err) => { console.error(err); alert("Erro: " + err.message); };
const alfa = (a, b) => a.nome.localeCompare(b.nome, "pt-BR", { numeric: true, sensitivity: "base" });
const cfgIA = () => { try { return JSON.parse(localStorage.getItem("ia_cfg") || "{}"); } catch (e) { return {}; } };

// Funções de Auxílio e Estado
const contar = (L, qs) => { const c = { acerto: 0, erro: 0, pendente: 0, branco: 0, anulada: 0 }; qs.forEach((q) => {
  const m = L.respostas[q.num], cb = L.gabarito[q.num];
  const st = !m ? "branco" : !L.corrigidas[q.num] ? "pendente" : !cb || cb === "ANULADA" ? "anulada" : m === cb ? "acerto" : "erro";
  c[st]++;
}); return c; };

const statTxt = (l) => { const c = contar(l, l.questoes), tot = l.questoes.length, cor = c.acerto + c.erro; return `${tot - c.branco}/${tot} resp. • ${cor ? Math.round((c.acerto / cor) * 100) + "%" : "—"}`; };

// Card "Continuar de Onde Parei" dinâmico
function renderContinuar() {
  if (!conteudo) return "";
  const reg = conteudo.regular || [];
  if (!reg.length) return "";
  const ultimo = reg[0]; // Pega a primeira matéria ou última ativa
  return `<div class="resume-box">
    <div class="resume-info">
      <h3>🚀 Continuar de onde parei</h3>
      <p><b>${esc(ultimo.nome)}</b> · ${esc(ultimo.material || "Início")} (${esc(ultimo.detalhe || "Acompanhe o ritmo")})</p>
    </div>
    <button class="pri" data-sec="conteudo">Ir para Conteúdo</button>
  </div>`;
}

function renderConteudo() {
  const el = $("secConteudo");
  if (!conteudo) { el.innerHTML = '<p class="muted">Carregando...</p>'; return; }
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2>📚 Gestão de Conteúdo e Progreso</h2>
    <button class="pri" onclick="$('dlgMateria').showModal()">➕ Adicionar Matéria</button>
  </div>` + renderContinuar() + (conteudo.regular || []).map((r, i) => `
    <div class="mcard" style="margin-bottom:12px">
      <div class="mtop">
        <span class="mdot" style="--h:${r.nome.length * 25}"><b>${r.nome.charAt(0)}</b></span>
        <input class="mnome" data-cs="regular" data-ci="${i}" data-cf="nome" value="${esc(r.nome)}">
      </div>
      <div class="mfields">
        <div class="fld"><label>Apostila / Aula</label><input data-cs="regular" data-ci="${i}" data-cf="material" value="${esc(r.material || "")}" placeholder="Ex: Apostila 12"></div>
        <div class="fld"><label>Página / Exercício</label><input data-cs="regular" data-ci="${i}" data-cf="detalhe" value="${esc(r.detalhe || "")}" placeholder="Ex: pág. 45"></div>
      </div>
    </div>`).join("");
}

// Sincronização automática dos inputs de Conteúdo
document.addEventListener("input", (e) => {
  const t = e.target;
  if (conteudo && t.dataset.cf) {
    conteudo[t.dataset.cs][+t.dataset.ci][t.dataset.cf] = t.value;
    clearTimeout(window._ts);
    window._ts = setTimeout(() => {
      setDoc(cfgRef("conteudo"), conteudo).catch(falha);
    }, 800);
  }
});

// Diagnóstico inteligente atualizado
function renderDiag() {
  const el = $("secDiagnostico");
  if (!conteudo) { el.innerHTML = '<p class="muted">Carregando...</p>'; return; }
  let ac = 0, er = 0, tot = 0;
  listas.forEach((l) => { const c = contar(l, l.questoes); ac += c.acerto; er += c.erro; tot += l.questoes.length; });
  const corr = ac + er, pct = corr ? (ac / corr) * 100 : 0;
  el.innerHTML = `<h2>🎯 Diagnóstico de Desempenho</h2>
    <div class="stats">
      <div><b>${tot}</b>Total de Questões</div>
      <div><b>${ac}</b>Acertos</div>
      <div><b>${er}</b>Erros</div>
      <div><b>${pct.toFixed(1)}%</b>Aproveitamento Global</div>
    </div>
    <div class="dlist">
      ${(conteudo.regular || []).map((m) => `
        <div class="drow ok">
          <b>${esc(m.nome)}</b>
          <p class="muted" style="margin:6px 0">Progresso atual: ${esc(m.material || "Início")} (${esc(m.detalhe || "—")})</p>
          <div class="bar"><i class="s-acerto" style="width:${pct}%"></i></div>
        </div>`).join("")}
    </div>`;
}

// Renderizador principal do Painel de Questões
function renderPainel() {
  const el = $("painel"), m = materias.find((x) => x.id === sel.materia);
  if (!m) { el.innerHTML = '<div class="card"><h3>Selecione ou crie uma matéria na barra lateral para começar.</h3></div>'; return; }
  const ls = listas.filter((l) => l.materia === m.id).sort(alfa);
  if (!ls.some((l) => l.id === sel.lista)) sel.lista = ls[0]?.id || null;
  el.innerHTML = `<div class="card"><h2>📖 ${esc(m.nome)}</h2>
    <p class="muted">Listas de Questões cadastradas: ${ls.length}</p></div>` +
    ls.map((l) => `<div class="card pdfrow" style="cursor:pointer" onclick="window._selLista('${l.id}')"><b>📄 ${esc(l.nome)}</b><span class="muted" style="float:right">${statTxt(l)}</span></div>`).join("");
}

window._selLista = (id) => { sel.lista = id; renderPainel(); };

function mostrarSecao(sec) {
  secao = sec;
  ["questoes", "diagnostico", "conteudo", "cronograma"].forEach((k) => { $("sec" + k[0].toUpperCase() + k.slice(1)).hidden = k !== sec; });
  document.querySelectorAll(".mi").forEach((b) => b.classList.toggle("on", b.dataset.sec === sec));
  if (sec === "questoes") renderPainel();
  else if (sec === "diagnostico") renderDiag();
  else if (sec === "conteudo") renderConteudo();
  else $("secCronograma").innerHTML = '<h2>🗓️ Cronograma Semanal</h2><p class="muted">Organize sua rotina de estudos para a SEFAZ-MG.</p>';
}

document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-sec]")?.dataset.sec;
  if (d) mostrarSecao(d);
});

// Autenticação Firebase
auth.useDeviceLanguage();
const autenticar = async (criar) => {
  $("erroLogin").textContent = "";
  try {
    await setPersistence(auth, $("lembrar").checked ? browserLocalPersistence : browserSessionPersistence);
    const fn = criar ? createUserWithEmailAndPassword : signInWithEmailAndPassword;
    await fn(auth, $("email").value.trim(), $("senha").value);
  } catch (e) { $("erroLogin").textContent = e.message; }
};
$("formLogin").onsubmit = (e) => { e.preventDefault(); autenticar(false); };
$("btnCriar").onclick = () => { if ($("formLogin").reportValidity()) autenticar(true); };
$("sair").onclick = () => signOut(auth);

onAuthStateChanged(auth, (u) => {
  user = u; materias = []; listas = []; conteudo = null; cron = null;
  $("login").hidden = !!u; $("app").hidden = !u; $("conta").hidden = !u;
  if (!u) return;
  $("usuario").textContent = u.email;
  
  onSnapshot(col("materias"), (s) => { materias = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort(alfa); renderMaterias(); renderPainel(); });
  onSnapshot(col("listas"), (s) => { listas = s.docs.map((d) => ({ id: d.id, ...d.data() })); renderPainel(); });
  onSnapshot(cfgRef("conteudo"), (s) => { conteudo = s.exists() ? s.data() : { regular: [{ nome: "Contabilidade Geral", material: "Apostila 15", detalhe: "pág. 32" }, { nome: "Direito Tributário", material: "Apostila 10", detalhe: "exercícios" }] }; if(secao==="conteudo") renderConteudo(); });
  mostrarSecao(secao);
});

function renderMaterias() {
  $("listaMaterias").innerHTML = materias.map((m) => `<button class="mitem ${m.id === sel.materia ? "on" : ""}" onclick="window._selMat('${m.id}')"><span class="mdot2"></span><span class="mn">${esc(m.nome)}</span></button>`).join("");
}
window._selMat = (id) => { sel.materia = id; sel.lista = null; renderMaterias(); renderPainel(); };

$("formDlg").onsubmit = (e) => {
  e.preventDefault();
  const nome = $("dNome").value.trim();
  if (!nome) return;
  addDoc(col("materias"), { nome, criado: Date.now() }).then((r) => {
    sel.materia = r.id; $('dlgMateria').close(); $("dNome").value = "";
  }).catch(falha);
};
</script>
</body>
</html>
